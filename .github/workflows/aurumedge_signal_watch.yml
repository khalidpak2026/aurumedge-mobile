name: AurumEdge Signal Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a notification test instead of checking the market
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aurumedge-signal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-alerts.txt

      - name: Install watcher dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-alerts.txt ]; then
            pip install -r requirements-alerts.txt
          else
            pip install -r requirements.txt
          fi

      - name: Restore newest alert and learning state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/alert_state.json
            data/adaptive_state.json
          key: aurumedge-runtime-state-${{ github.run_id }}
          restore-keys: |
            aurumedge-runtime-state-

      - name: Check signals, learn outcomes and send notifications
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_SYMBOL: XAU/USD
          BARS_PER_TIMEFRAME: "500"
          FREE_PLAN_MODE: "true"
          PROVIDER_DAILY_LIMIT: "800"
          CLOUD_WATCHER_MINUTES: "5"
          MACRO_ENABLED: "true"
          MACRO_REQUIRED_FOR_ENTRY: "false"
          H4_FVG_STRATEGY_ENABLED: "false"
          ADAPTIVE_LEARNING: "true"
          ADAPTIVE_STATE_PATH: data/adaptive_state.json
          ADAPTIVE_MIN_SAMPLES: "20"
          ADAPTIVE_HORIZON_BARS: "12"
          ADAPTIVE_MAX_WEIGHT_CHANGE: "0.05"
          ALERT_MIN_CONFIDENCE: ${{ secrets.ALERT_MIN_CONFIDENCE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_STATE_PATH: data/alert_state.json
          BURST_MAX_CHECKS: "4"
          BURST_INTERVAL_SECONDS: "45"
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python signal_watcher.py --test-alert
          else
            python signal_watcher.py --burst
          fi

      - name: Detect changed runtime state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_alert != true }}
        id: state
        run: |
          changed=false
          if [ -f data/.alert_state_changed ] || [ -f data/.adaptive_state_changed ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Save newest alert and learning state
        if: ${{ steps.state.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/alert_state.json
            data/adaptive_state.json
          key: aurumedge-runtime-state-${{ github.run_id }}

      - name: Daily durable brain backup
        if: ${{ github.event_name == 'schedule' && steps.state.outputs.changed == 'true' }}
        continue-on-error: true
        run: |
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          if [ "$hour" != "23" ] || [ "$minute" -lt "55" ]; then
            echo "Outside the daily backup window; runtime cache remains active."
            exit 0
          fi
          git config user.name "AurumEdge Learning Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adaptive_state.json
          if git diff --cached --quiet; then
            echo "No adaptive-state changes to commit."
            exit 0
          fi
          git commit -m "Update adaptive learning state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

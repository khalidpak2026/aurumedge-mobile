name: AurumEdge Signal Watch

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification instead of checking the market"
        required: false
        default: false
        type: boolean
  schedule:
    # 24/7 cloud checks every five minutes. Closed-market runs normally see no
    # new candle and therefore do not register a duplicate signal.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  watch-xauusd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: aurumedge-signal-watch
      cancel-in-progress: false

    steps:
      - name: Check out terminal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: Install watcher dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-alerts.txt

      - name: Restore 24/7 alert and learning state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/alert_state.json
            data/adaptive_state.json
          key: aurumedge-runtime-state-${{ github.run_id }}
          restore-keys: |
            aurumedge-runtime-state-

      - name: Send test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python signal_watcher.py --test-alert

      - name: Check three-pillar signals, learn outcomes and send notifications
        if: github.event_name != 'workflow_dispatch' || inputs.test_alert != true
        id: watcher
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_SYMBOL: XAU/USD
          BARS_PER_TIMEFRAME: "500"
          FREE_PLAN_MODE: "true"
          PROVIDER_DAILY_LIMIT: "800"
          CLOUD_WATCHER_MINUTES: "5"
          MACRO_ENABLED: "true"
          MACRO_REQUIRED_FOR_ENTRY: "false"
          H4_FVG_STRATEGY_ENABLED: "false"
          ADAPTIVE_LEARNING: "true"
          ADAPTIVE_STATE_PATH: data/adaptive_state.json
          ADAPTIVE_MIN_SAMPLES: "20"
          ADAPTIVE_HORIZON_BARS: "12"
          ADAPTIVE_MAX_WEIGHT_CHANGE: "0.05"
          ALERT_MIN_CONFIDENCE: ${{ secrets.ALERT_MIN_CONFIDENCE }}
          ALERT_FORMING_ENABLED: ${{ secrets.ALERT_FORMING_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_STATE_PATH: data/alert_state.json
          BURST_MAX_CHECKS: "4"
          BURST_INTERVAL_SECONDS: "45"
        run: python signal_watcher.py --burst

      - name: Detect changed runtime state
        if: github.event_name != 'workflow_dispatch' || inputs.test_alert != true
        id: state
        run: |
          changed=false
          if [ -f data/.alert_state_changed ] || [ -f data/.adaptive_state_changed ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Save newest 24/7 learning state
        if: (github.event_name != 'workflow_dispatch' || inputs.test_alert != true) && steps.state.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/alert_state.json
            data/adaptive_state.json
          key: aurumedge-runtime-state-${{ github.run_id }}

      - name: Daily durable brain backup to repository
        if: github.event_name == 'schedule' && steps.state.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # Cache carries learning between five-minute runs. Once near the end
          # of each UTC day, also commit the brain file so it survives cache
          # eviction and becomes available to the Streamlit deployment.
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          if [ "$hour" != "23" ] || [ "$minute" -lt "55" ]; then
            echo "Not the daily backup window; cache persistence is active."
            exit 0
          fi
          git config user.name "AurumEdge Learning Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adaptive_state.json
          if git diff --cached --quiet; then
            echo "No adaptive-state changes to commit."
            exit 0
          fi
          git commit -m "Update adaptive learning state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
